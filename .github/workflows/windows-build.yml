name: Revised QGC Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "windows-*"

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtcharts
          setup-python: false
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package
          Copy-Item build/Release/QGroundControl.exe package/QGroundControl.exe
          windeployqt --release --compiler-runtime --qmldir . package/QGroundControl.exe
          Compress-Archive -Path package/* -DestinationPath QGroundControl-Revised-Windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QGroundControl-Revised-Windows-x64
          path: QGroundControl-Revised-Windows-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: QGroundControl-Revised-Windows-x64.zip
