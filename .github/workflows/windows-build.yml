name: Revised QGC Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'windows-*'

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check source tree
        shell: pwsh
        run: |
          Get-Location
          Get-ChildItem
          if (!(Test-Path CMakeLists.txt)) {
            Write-Error 'CMakeLists.txt not found in repository root'
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtcharts
          setup-python: false
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G 'Visual Studio 17 2022' `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CONFIGURATION_TYPES=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package
          Copy-Item build/Release/QGroundControl.exe package/QGroundControl.exe
          windeployqt --release --compiler-runtime --qmldir . package/QGroundControl.exe
          # windeployqt does not know about QGC's imported third-party DLLs.
          Copy-Item libs/sdl2/msvc/lib/x64/SDL2.dll package/SDL2.dll
          $shp = Get-ChildItem -Path build -Filter shp.dll -Recurse | Select-Object -First 1
          if ($null -eq $shp) { Write-Error 'shp.dll was not produced by the build'; exit 1 }
          Copy-Item $shp.FullName package/shp.dll
          Compress-Archive -Path package/* -DestinationPath QGroundControl-Revised-Windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QGroundControl-Revised-Windows-x64
          path: QGroundControl-Revised-Windows-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: QGroundControl-Revised-Windows-x64.zip
